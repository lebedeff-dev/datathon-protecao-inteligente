<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguro Residencial · protótipo v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (Regras de design BB, vault 13 - Design) ===== */
:root{
  --amarelo:#FCFC30; --azul:#465EFF; --azul-escuro:#2D37F5; --azul-hover:#3135D9; --azul-claro:#E4ECFF; --azul-noite:#1B1F6B;
  --texto:#111214; --suave:#6C7077; --fundo:#F4F4F6; --borda:#DBDDE1; --branco:#fff;
  --verde:#0E8A4F; --verde-claro:#E3F6EC; --vermelho:#C8312B; --vermelho-claro:#FDECEA; --ambar:#8A5A00; --ambar-claro:#FFF4D6;
  --sombra:0 6px 8px rgba(24,24,27,.06),0 1px 4px rgba(24,24,27,.08),0 0 1px rgba(24,24,27,.08);
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --esc:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E3E6EE;font-family:Inter,system-ui,sans-serif;color:var(--texto);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
.palco{min-height:100%;display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 16px}

/* ===== Aparelho ===== */
.fone{width:390px;height:844px;border-radius:54px;background:#0C0D12;padding:12px;box-shadow:0 30px 60px rgba(20,24,60,.25),0 0 0 2px #2a2c35 inset;flex:none;position:sticky;top:20px}
.tela-fone{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--fundo);isolation:isolate}
.ilha{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:60}
.status{position:absolute;inset:0 0 auto 0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 15px Inter;color:#fff;z-index:50;pointer-events:none;transition:color .2s ease}
.status.escuro{color:var(--texto)}
.status svg{height:12px}

/* ===== App (cabeçalho, conteúdo, rodapé) ===== */
.app{position:absolute;inset:0;display:flex;flex-direction:column;transform-origin:50% 40%;transition:transform .42s var(--ease-drawer),opacity .3s ease}
.app.fechado{transform:scale(.92);opacity:0}
.barra{background:var(--azul);color:#fff;padding:54px 16px 10px;flex:none;position:relative;z-index:5}
.barra .linha{display:flex;align-items:center;gap:10px;height:36px}
.barra h1{font:800 calc(18px*var(--esc))/1 Nunito;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .volta{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;margin-left:-6px}
.barra .volta svg{width:22px;height:22px}
.pilula{height:28px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.18);font:700 12px Inter;display:flex;align-items:center;gap:5px;transition:background-color .15s ease}
.pilula svg{width:14px;height:14px}
.pilula.on{background:var(--amarelo);color:var(--azul-escuro)}
.progresso{display:flex;gap:4px;margin-top:10px}
.progresso i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;position:relative}
.progresso i::after{content:"";position:absolute;inset:0;background:var(--amarelo);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-in-out)}
.progresso i.on::after{transform:scaleX(1)}
.passo-txt{font:500 12px Inter;opacity:.9;margin-top:7px;height:15px}
.barra.sem-passo .progresso,.barra.sem-passo .passo-txt{display:none}

.conteudos{position:relative;flex:1;overflow:hidden;background:var(--fundo)}
.vista{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px;scrollbar-width:none;will-change:transform}
.vista::-webkit-scrollbar{display:none}
.vista.entra-dir{animation:entraDir .34s var(--ease-drawer) both}
.vista.entra-esq{animation:entraEsq .34s var(--ease-drawer) both}
.vista.sai-esq{animation:saiEsq .34s var(--ease-drawer) both;pointer-events:none}
.vista.sai-dir{animation:saiDir .34s var(--ease-drawer) both;pointer-events:none}
@keyframes entraDir{from{transform:translateX(100%)}to{transform:none}}
@keyframes entraEsq{from{transform:translateX(-28%);opacity:.6}to{transform:none;opacity:1}}
@keyframes saiEsq{to{transform:translateX(-28%);opacity:.6}}
@keyframes saiDir{to{transform:translateX(100%)}}
.vista.entra-dir,.vista.entra-esq{z-index:2;box-shadow:-8px 0 24px rgba(0,0,0,.06)}
.entra{animation:subir .4s var(--ease-out) both;animation-delay:calc(var(--i,0)*45ms + 80ms)}
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.rodape{flex:none;background:#fff;padding:12px 16px 30px;display:flex;gap:10px;box-shadow:0 -1px 0 var(--borda);position:relative;z-index:5;transition:transform .3s var(--ease-out)}
.rodape.oculto{transform:translateY(110%)}
.btn{flex:1;min-height:calc(52px*var(--esc));border-radius:8px;font:800 calc(15px*var(--esc)) Inter;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;transition:transform .12s var(--ease-out),background-color .15s ease,opacity .2s ease}
.btn:active{transform:scale(.97)}
.btn-am{background:var(--amarelo);color:var(--azul-escuro)}
.btn-az{background:var(--azul);color:#fff}
.btn-cl{background:var(--azul-claro);color:var(--azul-escuro)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-ajuda{flex:none;width:56px;border-radius:10px;border:1.5px solid var(--azul);color:var(--azul-escuro);font:700 11px Inter;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s var(--ease-out)}
.btn-ajuda:active{transform:scale(.95)}
.btn-ajuda svg{width:22px;height:22px}
.giro{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

/* ===== Tipografia e cards ===== */
h2{font:900 calc(25px*var(--esc))/1.12 Nunito;margin:2px 0 6px;letter-spacing:-.01em}
h2 em,h3 em{color:var(--azul);font-style:italic}
h3{font:800 calc(17px*var(--esc))/1.2 Nunito;margin:0 0 8px}
.sub{color:var(--suave);font-size:calc(14px*var(--esc));line-height:1.45;margin:0 0 16px}
.card{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:16px;margin-bottom:12px}
.rotulo{font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin:18px 2px 8px}
p{line-height:1.45}
.mini{font-size:calc(12px*var(--esc));color:var(--suave);line-height:1.4}
.selo{display:inline-flex;align-items:center;gap:4px;font:700 11px Inter;padding:3px 8px;border-radius:999px;white-space:nowrap}
.selo.obs{background:var(--verde-claro);color:var(--verde)}
.selo.est{background:var(--ambar-claro);color:var(--ambar)}
.selo.conf{background:var(--azul-claro);color:var(--azul-escuro)}
.selo.fixa{background:var(--azul-claro);color:var(--azul-escuro)}
.selo.extra{background:#F1F2F4;color:var(--suave)}
.selo.adic{background:var(--amarelo);color:var(--azul-escuro)}

/* ===== Tela de bloqueio ===== */
.bloqueio{position:absolute;inset:0;z-index:40;background:#1C2266;color:#fff;display:flex;flex-direction:column;align-items:stretch;padding:96px 12px 28px;transition:opacity .32s ease,transform .42s var(--ease-drawer);overflow:hidden}
.bloqueio::before{content:"";position:absolute;inset:-20%;background:radial-gradient(60% 40% at 20% 15%,#465EFF 0,transparent 70%),radial-gradient(50% 40% at 85% 70%,#2D37F5 0,transparent 70%),radial-gradient(40% 30% at 30% 95%,#3BE0C9 0,transparent 70%);opacity:.75;z-index:-1}
.bloqueio.fora{opacity:0;transform:scale(1.06);pointer-events:none}
.relogio{font:800 84px/1 Nunito;text-align:center;letter-spacing:-.02em}
.data{text-align:center;font:600 17px Inter;opacity:.92;margin:6px 0 34px}
.notif{background:rgba(245,246,250,.92);color:var(--texto);border-radius:22px;padding:12px 14px;margin-bottom:10px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .14s var(--ease-out);animation:notifEntra .5s var(--ease-out) both;animation-delay:calc(var(--i,0)*220ms + 250ms)}
.notif:active{transform:scale(.97)}
@keyframes notifEntra{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
.notif .app-n{display:flex;align-items:center;gap:7px;font:500 12px Inter;color:#4a4d55;margin-bottom:5px}
.notif .ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:900 9px Nunito}
.notif b{display:block;font:700 15px/1.25 Inter;margin-bottom:2px}
.notif p{margin:0;font-size:14px;line-height:1.35}
.notif .fonte-n{font-size:11px;color:#6C7077;margin-top:6px}
.dica-bloq{margin-top:auto;text-align:center;font:500 13px Inter;opacity:.8}
.barra-home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff;z-index:61;opacity:.9;pointer-events:none;transition:background-color .2s ease}
.barra-home.escura{background:#111}

/* ===== Folha de baixo (sheet) ===== */
.veu{position:absolute;inset:0;background:rgba(10,12,30,.42);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:30}
.veu.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:22px 22px 0 0;z-index:31;transform:translateY(100%);transition:transform .42s var(--ease-drawer);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .alca{width:40px;height:5px;border-radius:3px;background:#D5D8DE;margin:8px auto 4px;flex:none}
.sheet .corpo{overflow-y:auto;padding:8px 18px 30px;scrollbar-width:none}
.sheet .corpo::-webkit-scrollbar{display:none}

/* ===== Toast ===== */
.toast{position:absolute;left:16px;right:16px;top:58px;z-index:45;background:var(--texto);color:#fff;border-radius:14px;padding:12px 14px;font:600 14px Inter;display:flex;gap:10px;align-items:center;transform:translateY(-140%);transition:transform .38s var(--ease-drawer)}
.toast.on{transform:none}
.toast svg{width:20px;height:20px;flex:none;color:var(--amarelo)}

/* ===== Passo 1 · Sua casa ===== */
.porque{background:var(--azul);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.porque h3{color:#fff;margin-bottom:10px}
.porque ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.porque li{display:flex;gap:10px;font-size:calc(14px*var(--esc));line-height:1.4}
.porque li svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--amarelo)}
.porque .fonte{font-size:11.5px;opacity:.8;margin-top:12px}
.dado{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #EEF0F3}
.dado:last-child{border-bottom:none;padding-bottom:2px}
.dado:first-child{padding-top:2px}
.dado .k{font-size:12.5px;color:var(--suave)}
.dado .v{font:700 calc(15px*var(--esc)) Inter;margin-top:2px}
.conf-bar{display:flex;align-items:center;gap:12px}
.medidor{flex:1;height:8px;border-radius:4px;background:#ECEEF2;overflow:hidden}
.medidor i{display:block;height:100%;width:100%;border-radius:4px;transform-origin:left;transition:transform .6s var(--ease-out),background-color .3s ease}
.pergunta{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:14px 16px;margin-bottom:10px;transition:background-color .25s ease}
.pergunta.ok{background:var(--verde-claro)}
.pergunta p{margin:0 0 10px;font:600 calc(14.5px*var(--esc))/1.4 Inter}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opc{padding:9px 14px;border-radius:999px;border:1.5px solid var(--borda);font:600 13.5px Inter;background:#fff;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .12s var(--ease-out)}
.opc:active{transform:scale(.96)}
.opc.on{background:var(--azul);border-color:var(--azul);color:#fff}
.ganho{font-size:12px;color:var(--azul-escuro);margin-top:8px}

/* ===== Passo 2 · O que cobre ===== */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:#fff;box-shadow:var(--sombra);font:700 13px Inter;display:flex;align-items:center;gap:6px;transition:background-color .2s ease,color .2s ease}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--azul);color:#fff}
.cena{background:#fff;border-radius:16px;box-shadow:var(--sombra);overflow:hidden;margin-bottom:6px}
.cena .ilu{background:var(--azul-claro);height:128px;display:grid;place-items:center;position:relative}
.cena .ilu svg{height:112px;transition:opacity .2s ease,transform .3s var(--ease-out)}
.cena .ilu.troca svg{opacity:0;transform:translateY(6px) scale(.97)}
.cena .txt{padding:14px 16px 4px}
.cena .txt b{font:800 calc(16px*var(--esc)) Nunito}
.cena .txt p{margin:4px 0 0;font-size:calc(13.5px*var(--esc));color:var(--suave)}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 16px}
.caixa{border-radius:12px;padding:10px 12px}
.caixa span{font-size:12px;line-height:1.3;display:block}
.caixa strong{font:900 calc(22px*var(--esc))/1.1 Nunito;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.caixa.sem{background:var(--vermelho-claro);color:var(--vermelho)}
.caixa.com{background:var(--verde-claro);color:var(--verde)}
.caixa.com.nao{background:#F1F2F4;color:var(--suave)}
.base-calc{font-size:11.5px;color:var(--suave);padding:0 16px 14px;margin-top:-4px}
.cob{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #EEF0F3;transition:background-color .3s ease}
.cob:last-child{border-bottom:none}
.cob .ico{flex:none;width:36px;height:36px;border-radius:50%;background:var(--azul-claro);color:var(--azul);display:grid;place-items:center}
.cob .ico svg{width:19px;height:19px}
.cob.nao .ico{background:#F1F2F4;color:#9A9EA6}
.cob .t{flex:1;min-width:0}
.cob .t b{font:700 calc(14.5px*var(--esc)) Inter;display:block}
.cob .t span{font-size:calc(12.5px*var(--esc));color:var(--suave);display:block;margin-top:2px;line-height:1.35}
.cob .t .fr{display:inline-block;margin-top:5px;font:600 11px Inter;color:var(--azul-escuro);background:var(--azul-claro);border-radius:6px;padding:2px 7px}
.cob .val{font:800 13px Inter;color:var(--azul-escuro);white-space:nowrap;text-align:right}
.cob .val small{display:block;font:500 11px Inter;color:var(--suave)}
.cob.destaque{background:linear-gradient(90deg,transparent,rgba(70,94,255,.07),transparent)}
.grade-pac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pac{background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:10px 6px;text-align:center;font:600 11.5px/1.25 Inter}
.pac .ico{width:34px;height:34px;border-radius:50%;background:var(--azul-claro);color:var(--azul);display:grid;place-items:center;margin:0 auto 6px}
.pac .ico svg{width:18px;height:18px}
.pac.off{opacity:.38}

/* ===== Passo 3 · Seu plano ===== */
.plano{position:relative;background:#fff;border-radius:16px;box-shadow:var(--sombra);padding:16px;margin-bottom:12px;border:2px solid transparent;text-align:left;width:100%;display:block;transition:border-color .2s ease,transform .12s var(--ease-out)}
.plano:active{transform:scale(.985)}
.plano.on{border-color:var(--azul)}
.plano .tag{position:absolute;top:-11px;left:14px;background:var(--amarelo);color:var(--azul-escuro);font:800 10.5px Inter;letter-spacing:.05em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.plano .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plano .nome{font:900 calc(21px*var(--esc)) Nunito;color:var(--azul-escuro)}
.plano .preco{font:800 calc(16px*var(--esc)) Inter;white-space:nowrap}
.plano .preco small{font:500 12px Inter;color:var(--suave)}
.plano .qtd{font-size:12.5px;color:var(--suave);margin:2px 0 8px}
.plano .add{font-size:calc(13.5px*var(--esc));line-height:1.4}
.plano .marca{position:absolute;right:14px;bottom:14px;width:24px;height:24px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .2s ease,transform .25s var(--ease-out)}
.plano .marca svg{width:14px;height:14px}
.plano.on .marca{opacity:1;transform:none}
.motivo{background:var(--azul-claro);border-radius:12px;padding:12px 14px;margin:10px 0 2px}
.motivo b{font:800 13px Inter;color:var(--azul-escuro)}
.motivo ul{margin:6px 0 0;padding-left:18px;font-size:calc(13.5px*var(--esc));line-height:1.45}
.motivo li{margin-bottom:3px}
.aviso-menos{display:flex;gap:10px;background:var(--vermelho-claro);color:#7c1d18;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.4;margin:4px 0 14px}
.aviso-menos svg{flex:none;width:18px;height:18px;margin-top:1px}

/* ===== Passo 4 · Ajustar ===== */
.preco-fixo{position:sticky;top:-18px;z-index:3;margin:-18px -16px 12px;padding:12px 16px;background:rgba(244,244,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.preco-box{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.preco-box b{font:900 24px Nunito;color:var(--azul-escuro);font-variant-numeric:tabular-nums}
.preco-box .dif{font:700 12px Inter;margin-top:2px;min-height:15px;transition:color .2s ease}
.lista-aj{background:#fff;border-radius:14px;box-shadow:var(--sombra);overflow:hidden;margin-bottom:12px}
.aj{border-bottom:1px solid #EEF0F3}
.aj:last-child{border-bottom:none}
.aj-topo{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.aj-topo .n{flex:1;min-width:0}
.aj-topo .n b{font:700 calc(14px*var(--esc)) Inter;display:block}
.aj-topo .n span{font-size:11.5px;color:var(--suave)}
.aj-valor{font:800 calc(14.5px*var(--esc)) Inter;color:var(--azul-escuro);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.aj-valor svg{width:16px;height:16px;transition:transform .25s var(--ease-out)}
.aj.aberto .aj-valor svg{transform:rotate(180deg)}
.aj.desligada .aj-valor{color:#A3A7AE;text-decoration:line-through}
.aj-edit{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease-out)}
.aj.aberto .aj-edit{grid-template-rows:1fr}
.aj-edit>div{overflow:hidden}
.aj-edit .in{padding:0 14px 14px}
.campo{display:flex;align-items:center;background:var(--fundo);border-radius:10px;border:1.5px solid transparent;padding:0 12px;height:48px;transition:border-color .15s ease}
.campo:focus-within{border-color:var(--azul)}
.campo.erro{border-color:var(--vermelho)}
.campo span{font:700 16px Inter;color:var(--suave);margin-right:6px}
.campo input{flex:1;border:none;background:none;font:800 18px Inter;color:var(--texto);outline:none;min-width:0;font-variant-numeric:tabular-nums}
.limites{display:flex;justify-content:space-between;font-size:11.5px;color:var(--suave);margin:6px 2px 8px}
.rapidos{display:flex;gap:6px}
.rapidos button{flex:1;padding:8px 4px;border-radius:8px;background:var(--azul-claro);color:var(--azul-escuro);font:700 12px Inter;transition:transform .12s var(--ease-out)}
.rapidos button:active{transform:scale(.96)}
.dica-aj{font-size:12px;line-height:1.4;color:var(--suave);margin-top:8px}
.dica-aj.alerta{color:var(--vermelho)}
.chave{width:44px;height:26px;border-radius:13px;background:#C9CCD3;position:relative;flex:none;transition:background-color .2s ease}
.chave::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .22s var(--ease-out)}
.chave.on{background:var(--verde)}
.chave.on::after{transform:translateX(18px)}
.troca-plano{display:flex;gap:10px;background:var(--ambar-claro);color:#5f3e00;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.4;margin-bottom:12px}
.troca-plano button{color:var(--azul-escuro);font-weight:800;text-decoration:underline}

/* ===== Passo 5 · Conferir (estilo checkout) ===== */
.secao{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:14px 16px;margin-bottom:10px}
.secao .topo-s{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.secao .topo-s span{font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.secao .topo-s button{font:700 13px Inter;color:var(--azul-escuro)}
.linha-ic{display:flex;gap:12px;align-items:center}
.linha-ic .ico{flex:none;width:38px;height:38px;border-radius:50%;background:var(--azul-claro);color:var(--azul);display:grid;place-items:center}
.linha-ic .ico svg{width:19px;height:19px}
.linha-ic b{font:700 calc(15px*var(--esc)) Inter;display:block}
.linha-ic small{font-size:12.5px;color:var(--suave)}
.vig{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.vig button{border-radius:10px;border:1.5px solid var(--borda);padding:8px 2px;text-align:center;font:800 13px Inter;transition:border-color .15s ease,background-color .15s ease}
.vig button small{display:block;font:600 10.5px Inter;color:var(--verde);margin-top:2px}
.vig button.on{border-color:var(--azul);background:var(--azul-claro);color:var(--azul-escuro)}
.soma{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--suave)}
.soma b{color:var(--texto);font-variant-numeric:tabular-nums}
.soma.total{font-size:15px;color:var(--texto);font-weight:700;border-top:1px dashed var(--borda);margin-top:6px;padding-top:10px}
.soma.total b{font:900 19px Nunito;color:var(--azul-escuro)}
.marcar{display:flex;gap:12px;align-items:flex-start;padding:10px 0;text-align:left;width:100%}
.caixinha{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--borda);display:grid;place-items:center;transition:background-color .15s ease,border-color .15s ease}
.caixinha svg{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.7);transition:opacity .15s ease,transform .2s var(--ease-out)}
.marcar.on .caixinha{background:var(--azul);border-color:var(--azul)}
.marcar.on .caixinha svg{opacity:1;transform:none}
.marcar span{font-size:calc(13.5px*var(--esc));line-height:1.4}
.resumo-ped{border-radius:14px;background:var(--fundo);padding:4px 14px;margin:6px 0 14px}
.resumo-ped .linha-ic{padding:12px 0;border-bottom:1px solid #E6E8EC}
.resumo-ped .linha-ic:last-child{border-bottom:none}

/* ===== Sucesso ===== */
.sucesso{position:absolute;inset:0;z-index:35;background:var(--azul);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .3s ease}
.sucesso.on{opacity:1;pointer-events:auto}
.sucesso svg{width:120px;height:120px}
.sucesso .circ{stroke-dasharray:340;stroke-dashoffset:340}
.sucesso .chk{stroke-dasharray:80;stroke-dashoffset:80}
.sucesso.on .circ{animation:traco .6s var(--ease-out) .1s forwards}
.sucesso.on .chk{animation:traco .4s var(--ease-out) .55s forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.sucesso h2{color:#fff;margin-top:22px}
.sucesso h2 em{color:var(--amarelo)}
.sucesso p{opacity:.9;max-width:280px}
.sucesso .t{opacity:0}
.sucesso.on .t{animation:subir .45s var(--ease-out) .75s both}

/* ===== Meu seguro ===== */
.apolice{background:var(--azul);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px}
.apolice .casa-ilu{position:absolute;right:-6px;bottom:-8px;width:120px;opacity:.95}
.apolice .st{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font:700 12px Inter}
.apolice .st i{width:8px;height:8px;border-radius:50%;background:#56E39F;box-shadow:0 0 0 0 rgba(86,227,159,.6);animation:pulso 2s ease-out infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(86,227,159,0)}100%{box-shadow:0 0 0 0 rgba(86,227,159,0)}}
.apolice h3{color:#fff;font-size:22px;margin:12px 0 2px}
.apolice .end{font-size:13px;opacity:.9;max-width:210px}
.apolice .num{display:flex;gap:18px;margin-top:16px;font-size:11.5px;opacity:.95}
.apolice .num b{display:block;font:800 14px Inter;margin-top:2px}
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.atalho{display:flex;flex-direction:column;align-items:center;gap:7px;font:600 11.5px/1.25 Inter;text-align:center;padding:4px 0;transition:transform .12s var(--ease-out)}
.atalho:active{transform:scale(.95)}
.atalho .ico{width:52px;height:52px;border-radius:50%;background:var(--azul-claro);color:var(--azul);display:grid;place-items:center}
.atalho .ico svg{width:23px;height:23px}
.atalho.urg .ico{background:var(--amarelo);color:var(--azul-escuro)}
.linha-tempo{position:relative;padding-left:26px}
.linha-tempo::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:#E6E8EC}
.marco{position:relative;padding:4px 0 12px}
.marco::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #C9CCD3}
.marco.feito::before{background:var(--verde);border-color:var(--verde)}
.marco.agora::before{border-color:var(--azul);background:var(--azul-claro)}
.marco b{font:700 14px Inter;display:block}
.marco span{font-size:12.5px;color:var(--suave)}
.barras{display:grid;gap:10px}
.barra-cob .tl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.barra-cob .tl b{font-weight:700}
.barra-cob .tr{height:6px;border-radius:3px;background:#ECEEF2;overflow:hidden}
.barra-cob .tr i{display:block;height:100%;background:var(--azul);border-radius:3px;transform-origin:left;transform:scaleX(var(--p));animation:crescer .8s var(--ease-out) both;animation-delay:calc(var(--i)*60ms + 200ms)}
@keyframes crescer{from{transform:scaleX(0)}}
.atualiza{display:flex;gap:12px;align-items:center;background:var(--amarelo);border-radius:14px;padding:14px;color:var(--azul-escuro);margin-bottom:12px;text-align:left;width:100%}
.atualiza svg{flex:none;width:26px;height:26px}
.atualiza b{display:block;font:800 14px Inter}
.atualiza span{font-size:12.5px;line-height:1.35}

/* ===== Ajuda / gerente ===== */
.faq{border-bottom:1px solid #EEF0F3}
.faq button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 0;font:700 calc(14.5px*var(--esc))/1.35 Inter}
.faq button svg{flex:none;width:18px;height:18px;color:var(--azul);transition:transform .25s var(--ease-out)}
.faq.on button svg{transform:rotate(45deg)}
.faq .r{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease-out)}
.faq.on .r{grid-template-rows:1fr}
.faq .r>div{overflow:hidden}
.faq .r p{margin:0 0 14px;font-size:calc(14px*var(--esc));color:#3a3d44}
.gerente-card{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font:900 20px Nunito;position:relative}
.avatar::after{content:"";position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#56E39F;border:2.5px solid #fff}
.canais{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.canal{border-radius:12px;border:1.5px solid var(--borda);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 12.5px Inter;transition:border-color .15s ease,background-color .15s ease}
.canal svg{width:22px;height:22px;color:var(--azul)}
.canal.on{border-color:var(--azul);background:var(--azul-claro);color:var(--azul-escuro)}
.mudou{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #EEF0F3;font-size:13.5px;line-height:1.4}
.mudou:last-child{border-bottom:none}
.mudou svg{flex:none;width:18px;height:18px;color:var(--verde);margin-top:1px}

/* ===== Painel lateral (só no computador) ===== */
.painel{width:400px;flex:none;display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
.pbox{background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:18px}
.pbox h4{font:900 18px Nunito;margin:0 0 4px;color:var(--azul-escuro)}
.pbox .q{font-size:12.5px;color:var(--suave);margin:0 0 10px}
.casos{display:flex;flex-wrap:wrap;gap:6px}
.casos button,.navs button{border:1.5px solid var(--borda);border-radius:999px;padding:6px 11px;font:600 12px Inter;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.casos button.on,.navs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.navs{display:flex;flex-wrap:wrap;gap:6px}
.antes,.depois{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-top:8px}
.antes{background:var(--vermelho-claro);color:#6b1a15}
.depois{background:var(--verde-claro);color:#0b4d2e}
.raiox{font-size:12.5px;line-height:1.45}
.raiox table{width:100%;border-collapse:collapse;margin-top:6px}
.raiox td{padding:5px 4px;border-bottom:1px solid #EEF0F3;vertical-align:top}
.raiox td:first-child{color:var(--suave);white-space:nowrap}
.raiox .tit{font:800 12px Inter;color:var(--azul-escuro);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.atalhos-tec{font-size:11.5px;color:var(--suave)}
.link-g{display:inline-flex;align-items:center;gap:6px;font:700 13px Inter;color:var(--azul-escuro);text-decoration:none;margin-top:8px}
.link-g svg{width:18px;height:18px;flex:none}

body.simples{--esc:1.18}

@media (max-width:860px){ .painel{display:none} }
@media (max-width:500px){
  .palco{padding:0}
  .fone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none;position:static}
  .tela-fone{border-radius:0}
  .ilha,.barra-home{display:none}
}
@media (prefers-reduced-motion:reduce){
  .vista.entra-dir,.vista.entra-esq,.vista.sai-esq,.vista.sai-dir{animation:fade .2s ease both}
  .vista.sai-esq,.vista.sai-dir{animation-name:fadeOut}
  .entra,.notif,.barra-cob .tr i{animation:fade .2s ease both}
  .sheet,.toast,.app,.bloqueio{transition:opacity .2s ease}
  .sheet{transform:none;opacity:0;pointer-events:none}.sheet.on{opacity:1;pointer-events:auto}
  .toast{transform:none;opacity:0}.toast.on{opacity:1}
  .bloqueio.fora,.app.fechado{transform:none}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}

// padrão de cada cobertura; acima dele, cada real a mais custa 10% da taxa (proteção extra sai mais barata,
// como no primeiro risco absoluto). Fica entre R$ 51 e R$ 128/mês nos casos da demo.
const BASE = 18.34, PACOTE = 4.5, ACIMA_DO_PADRAO = .1, DESCONTO = {1: 0, 2: .05, 3: .096, 4: .14, 5: .18};
const MAPA_COB = {INCENDIO_RAIO_EXPLOSAO_FUMACA: "incendio", DANOS_ELETRICOS: "eletricos", DANOS_POR_AGUA: "agua", VENDAVAL_GRANIZO: "vendaval",

const FD = window.FICHAS_DEMO;
const cidade = f => { const c = f.local.split("/")[0]; return ACENTO[c] || c; };
const uf = f => f.local.split("/")[1];
const ehApto = f => f.campos.tipo.valor === "APARTAMENTO";
const naCidade = f => (ehApto(f) ? "Seu apê" : "Sua casa") + " em " + cidade(f);
const cobFicha = (f, k) => f.coberturas.find(c => MAPA_COB[c.cobertura] === k);
const temAdicional = (f, k) => f.adicionais.some(a => MAPA_COB[a.cobertura] === k);

function aplicarCaso(chave){
  const id = FD.casos[chave], f = FD.fichas[id];
  st.caso = chave; st.f = f; st.plano = st.rec = f.plano;
  st.resp = {}; st.vig = 1; st.entend = [false, false]; st.ajustada = false; st.aberta = null;
  st.cena = "agua";
  Object.keys(COB).forEach(k => {
    const c = cobFicha(f, k), P = COB[k];
    st.faixa[k] = c ? [c.min, c.max] : null;
    // valor sugerido: meio da faixa do motor (auditoria 28/10: o mínimo deixa subseguro), no passo e nos limites do produto
    const meio = c ? (c.min + c.max) / 2 : P.padrao;
    st.valores[k] = Math.min(P.max, Math.max(P.min, Math.round(meio / P.passo) * P.passo));
    st.ligadas[k] = true;
  });
  st.ligadas.rc = f.plano === "TOTAL" || temAdicional(f, "rc");
}
function incluidas(plano = st.plano){
  const p = PLANOS[plano], l = [...FIXAS, ...p.extras];
  if (plano !== "TOTAL" && st.ligadas.rc && !l.includes("rc")) l.push("rc");
  return l;
}
function preco(plano = st.plano, valores = st.valores, ligadas = st.ligadas){
  const p = PLANOS[plano];
  const custo = k => COB[k].taxa * (Math.min(valores[k], COB[k].padrao) + ACIMA_DO_PADRAO * Math.max(0, valores[k] - COB[k].padrao)) / 1000;
  let v = BASE + p.pacotes * PACOTE;
  FIXAS.forEach(k => v += custo(k));
  p.extras.forEach(k => { if (ligadas[k]) v += custo(k); });
  if (plano !== "TOTAL" && ligadas.rc) v += custo("rc");
  return v;
}
const precoFinal = () => preco() * (1 - DESCONTO[st.vig]);
function franquia(k, prejuizo){ const [pct, min] = COB[k].fr; return pct ? Math.max(min, pct * prejuizo) : min; }

// fatos do território já calculados pelo motor (vêm na justificativa da cobertura)
function chuvaDaCidade(f){
  const c = f.coberturas.find(c => c.cobertura === "DANOS_POR_AGUA");
  const m = c && c.justificativa.match(/registrou (\d+) ocorrências de chuvas intensas[^(]*\((\d+) nos últimos 10 anos; a última em (\d{4})\)/);
  return m ? {total: +m[1], dez: +m[2], ultima: m[3]} : null;
}
function energiaDaCidade(f){
  const c = f.coberturas.find(c => c.cobertura === "DANOS_ELETRICOS");
  const m = c && c.justificativa.match(/ficou em (\d+)º de (\d+)/);
  return m ? {pos: +m[1], total: +m[2]} : null;
}
const pctSinistro = (f, cob) => { const c = f.coberturas.find(c => c.cobertura === cob); const m = c && c.justificativa.match(/(\d+,\d)% dos acionamentos/); return m ? m[1] : null; };

/* Fatos do aviso: o que já protege e o que não, em reais, e um fato forte do imóvel.
   Nada de medo vazio: cada fato tem origem (cadastro, compras, Defesa Civil, ANEEL). */
function fatosDoAviso(f){
  const v = f.campos.vinculo.valor, b = f.campos.bens, vi = f.valor_imovel, fatos = [];
  if (v === "INQUILINO") fatos.push({t: `Você paga ${brl(f.sinais.aluguel)} de aluguel. Se o imóvel ficar inabitável, ele continua.`, o: "suas transações"});
  else if (vi.segundo_risco) fatos.push({t: `${v === "FINANCIADO" && !ehApto(f) && f.campos.tipo.valor === "CASA" ? "O seguro do financiamento" : "O seguro do condomínio"} cobre o prédio, não o que é seu: pelas suas compras, isso vale ${entre(b.min, b.max)}.`, o: "suas compras de 3 anos"});
  else fatos.push({t: `Reconstruir ${ehApto(f) ? "o apê" : "a casa"} custaria ${aprox((vi.reconstrucao_min + vi.reconstrucao_max) / 2)}, fora ${entre(b.min, b.max)} em bens.`, o: "custo oficial de obra (IBGE)"});
  const chuva = chuvaDaCidade(f), luz = energiaDaCidade(f);
  if (f.campos.uso.valor === "LAZER_VERANEIO") fatos.push({t: "Como ele fica vazio parte do tempo, um cano estourado pode passar dias sem ninguém ver.", o: "imóvel de lazer"});
  else if (f.sinais.vidracaria > 0) fatos.push({t: `Você gastou ${aprox(f.sinais.vidracaria)} com vidraçaria nos últimos 2 anos.`, o: "suas transações"});
  if (chuva && chuva.dez > 0) fatos.push({t: `${cidade(f)} teve ${chuva.dez} registros de chuva forte e alagamento em 10 anos (o último em ${chuva.ultima}).`, o: "Defesa Civil"});
  else if (luz && luz.pos > luz.total / 2) fatos.push({t: `A distribuidora de energia da sua cidade ficou em ${luz.pos}º de ${luz.total} no ranking de quedas.`, o: "ANEEL 2025"});
  return fatos;
}

  ];
}
function pagaComSeguro(c){
  if (!incluidas().includes(c.cob) || !st.ligadas[c.cob]) return null;
  return Math.min(c.prej, franquia(c.cob, c.prej)) + Math.max(0, c.prej - st.valores[c.cob]);
}

// ---------- animação de números ----------
function contar(el, para, fmt = brl, ms = 520){
  if (!el) return;
  const de = +el.dataset.v || 0; el.dataset.v = para;
  if (REDUZ || de === para){ el.textContent = fmt(para); return; }
  const t0 = performance.now();
  const passo = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(de + (para - de) * e); if (p < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
}

    <div class="card" style="margin:16px 0 0;box-shadow:none;background:var(--azul-claro);display:flex;gap:12px;align-items:center">
      <div class="avatar" style="width:44px;height:44px;font-size:16px">${GERENTE.inicial}</div>
      <div style="flex:1"><b style="font-size:14px">Ainda com dúvida?</b><div class="mini">O ${GERENTE.nome} vê a mesma proposta que você.</div></div>
    </div>
    <button class="btn btn-az" style="width:100%;margin-top:10px" onclick="fecharSheet();setTimeout(()=>ir('gerente'),200)">Falar com meu gerente</button>`);
}

/* =====================================================================
   NAVEGAÇÃO E COMPONENTES
   ===================================================================== */
const FLUXO = ["casa", "cobre", "plano", "ajuste", "conferir"];
function ir(id, op = {}){
  if (id === st.tela) return;
  if (window.speechSynthesis) speechSynthesis.cancel();
  const vindo = st.tela, volta = op.volta || (FLUXO.includes(id) && FLUXO.includes(vindo) && FLUXO.indexOf(id) < FLUXO.indexOf(vindo));
  if (!op.volta && !op.sem && vindo !== "bloqueio") st.historico.push(vindo);
  st.tela = id; st.aberta = null;
  const box = $("#conteudos"), velha = $(".vista:not(.sai-esq):not(.sai-dir)", box), nova = document.createElement("div");
  nova.className = "vista"; nova.innerHTML = TELAS[id].html();
  if (velha && !op.sem){
    velha.className = "vista " + (volta ? "sai-dir" : "sai-esq");
    nova.classList.add(volta ? "entra-esq" : "entra-dir");
    if (volta){ velha.style.zIndex = 3; }
    setTimeout(() => velha.remove(), 360);
    setTimeout(() => nova.classList.remove("entra-dir", "entra-esq"), 360);
  } else if (velha) velha.remove();
  box.appendChild(nova);
  chrome(); if (TELAS[id].pronto) TELAS[id].pronto();
  renderPainel();
}
function voltar(){
  if (!$("#sheet").classList.contains("on")){
    const ant = st.historico.pop();
    if (ant) ir(ant, {volta: true}); else voltarAoBloqueio();
  } else fecharSheet();
}
function redesenhar(){ const v = $(".vista"); if (v){ v.innerHTML = TELAS[st.tela].html(); if (TELAS[st.tela].pronto) TELAS[st.tela].pronto(); } chrome(); renderPainel(); }
function chrome(){
  const T = TELAS[st.tela];
  $("#tituloApp").textContent = T.titulo || "Seguro Residencial";
  $("#barra").classList.toggle("sem-passo", !T.passo);
  $$("#progresso i").forEach((i, n) => i.classList.toggle("on", T.passo && n < T.passo));
  $("#passoTxt").textContent = T.passo ? `Passo ${T.passo} de 5 · ${T.nome}` : "";
  atualizaRodape();
}
function atualizaRodape(){
  const T = TELAS[st.tela]; if (!T.cta) return;
  const c = T.cta();
  $("#rodape").innerHTML = `<button class="btn ${c.cl ? "btn-cl" : "btn-am"}" ${c.off ? "disabled" : ""} id="cta">${c.t}</button><button class="btn-ajuda" onclick="abrirAjuda()">${IC.ajuda}Ajuda</button>`;
  $("#cta").onclick = c.a;
}
function status(modo){ $("#status").classList.toggle("escuro", modo === "escuro"); $("#barraHome").classList.toggle("escura", modo === "escuro"); }

function abrirApp(){
  $("#bloqueio").classList.add("fora");
  $("#app").classList.remove("fechado");
  status("claro");
  const box = $("#conteudos"); box.innerHTML = "";
  st.tela = null; st.historico = [];
  ir(st.proxima || "casa", {sem: true}); st.proxima = null;
}
function voltarAoBloqueio(tipo){
  fecharSheet();
  $("#app").classList.add("fechado");
  const b = $("#bloqueio");
  b.innerHTML = tipo === "retorno" ? `
      <div class="relogio">9:58</div><div class="data">quinta-feira, 29 de outubro</div>
      <button class="notif" style="--i:0" onclick="st.proxima='ajustada';abrirApp()">
        <div class="app-n"><span class="ic" style="background:var(--amarelo);color:var(--azul-escuro)">BB</span>App BB · agora</div>
        <b>${GERENTE.nome} respondeu sobre o seu seguro</b><p>Ele conferiu os dados e ajustou a proposta. Toque para ver o que mudou. Nada foi contratado.</p>
      </button><div class="dica-bloq">Toque no aviso para abrir o app</div>` : TELAS.bloqueio.html();
  b.classList.remove("fora");
  st.tela = "bloqueio"; renderPainel();
}
function abrirSheet(html){ $("#sheetCorpo").innerHTML = html; $("#sheetCorpo").scrollTop = 0; $("#veu").classList.add("on"); $("#sheet").classList.add("on"); }
function fecharSheet(){ $("#veu").classList.remove("on"); $("#sheet").classList.remove("on"); }
let tToast;
function mostrarToast(t){ const e = $("#toast"); e.innerHTML = IC.check + "<span>" + t + "</span>"; e.classList.add("on"); clearTimeout(tToast); tToast = setTimeout(() => e.classList.remove("on"), 2600); }

function toggleSimples(){ document.body.classList.toggle("simples"); $("#btnAa").classList.toggle("on"); redesenhar(); }
function ouvir(){
  if (!window.speechSynthesis) return mostrarToast("Leitura em voz alta indisponível neste navegador");
  if (speechSynthesis.speaking){ speechSynthesis.cancel(); $("#btnOuvir").classList.remove("on"); return; }
  const v = $(".vista"); const u = new SpeechSynthesisUtterance(v.innerText.replace(/\s+/g, " ").slice(0, 900));
  u.lang = "pt-BR"; u.rate = 1.05; u.onend = () => $("#btnOuvir").classList.remove("on");
  $("#btnOuvir").classList.add("on"); speechSynthesis.speak(u);
}

/* =====================================================================
   PAINEL LATERAL (para a banca; não aparece no celular)
   ===================================================================== */
const ROTULO_CASO = {perfil_A_apto_urbano: "A · Apto urbano", perfil_B_casa_familiar: "B · Casa familiar", perfil_C_casa_lazer: "C · Imóvel de lazer",
  nao_elegivel_seguro_existente: "Já segurado", inquilino_total: "Inquilino", elegibilidade_a_confirmar: "A confirmar"};
const NOME_TELA = {bloqueio: "0 · Aviso", casa: "1 · Sua casa", cobre: "2 · O que protege", plano: "3 · Seu plano", ajuste: "4 · Ajustar", conferir: "5 · Conferir", meu: "Meu seguro", gerente: "Ajuda → gerente", avisado: "Gerente avisado", ajustada: "Proposta ajustada"};
function renderPainel(){
  const p = $("#painel"); if (!p || getComputedStyle(p).display === "none") return;
  const f = st.f, T = TELAS[st.tela] || TELAS.bloqueio;
  p.innerHTML = `
    <div class="pbox"><h4>Seguro Residencial · protótipo v4</h4>
      <p class="q">Caso real da base de teste, lido de <code>fichas_demo.js</code> (motor). Preços ilustrativos.</p>
      <div class="casos">${Object.keys(ROTULO_CASO).filter(k => FD.casos[k]).map(k => `<button class="${k === st.caso ? "on" : ""}" onclick="trocarCaso('${k}')">${ROTULO_CASO[k]}</button>`).join("")}</div>
      <div class="rotulo" style="margin-top:14px">Telas</div>
      <div class="navs">${Object.keys(NOME_TELA).map(k => `<button class="${k === st.tela ? "on" : ""}" onclick="pular('${k}')">${NOME_TELA[k]}</button>`).join("")}</div>
      <p class="atalhos-tec" style="margin-top:10px">Teclas: ← → navegam · X liga o raio-X · R recomeça</p>
      <a class="link-g" href="indexprototipo_gerente.html" target="_blank">${IC.olho}Painel do gerente (computador)</a>
    </div>
    <div class="pbox"><h4>${NOME_TELA[st.tela] || ""}</h4>
      ${T.antes && T.antes !== "—" ? `<div class="antes"><b>App atual:</b> ${T.antes}</div>` : ""}
      <div class="depois"><b>Nossa proposta:</b> ${T.depois}</div></div>
    <div class="pbox"><div style="display:flex;justify-content:space-between;align-items:center"><h4>Raio-X do motor</h4><button class="pilula ${st.raiox ? "on" : ""}" style="background:${st.raiox ? "var(--amarelo)" : "var(--azul-claro)"};color:var(--azul-escuro)" onclick="st.raiox=!st.raiox;renderPainel()">${st.raiox ? "ligado" : "desligado"}</button></div>
      ${st.raiox ? `<p class="q" style="margin-top:6px">Isso é o que o banco vê. O cliente vê só a versão simples.</p><div class="raiox">${raioX(f)}</div>` : ""}</div>`;
}
function raioX(f){
  const linha = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  const t = st.tela;
  if (t === "bloqueio") return `<div class="tit">Fatos do aviso</div><table>${fatosDoAviso(f).map(x => linha(x.o, x.t)).join("")}</table>
    <div class="tit">Motivo completo (planilha)</div><p style="margin:4px 0">${f.motivo_cliente}</p><p class="q">Fatos do cliente usados: ${f.motivo_fatos.join(", ")}</p>`;
  if (t === "casa" || t === "gerente") return `<table>${Object.entries(f.campos).map(([k, d]) => linha(k, `<b>${d.valor}</b> · ${d.classe}<br><span style="color:var(--suave)">${d.fonte}</span>`)).join("")}</table>
    <div class="tit">Confiança</div>${f.confianca} · ${f.confianca_motivo} · canal ${f.canal}
    <div class="tit">Elegibilidade</div>${f.elegibilidade}${f.pendencias.length ? " · " + f.pendencias.map(p => p.codigo).join(", ") : ""}
    <div class="tit">Não usado</div>Renda e idade (teste de justiça: 0 casos mudam)`;
  if (t === "cobre" || t === "ajuste" || t === "meu") return `<table>${f.coberturas.map(c => linha(MAPA_COB[c.cobertura] ? COB[MAPA_COB[c.cobertura]].curto : c.cobertura, `${brl(c.min)} a ${brl(c.max)} · ${c.confianca}<br><span style="color:var(--suave)">${c.regra}</span>`)).join("")}</table>
    <p class="q">Valor sugerido no app = meio da faixa, dentro do limite do produto. Situações 'e se' = mínimo da faixa.</p>`;
  if (t === "plano") return `<table>${f.motivos.map(m => linha(`${m.plano} +${m.peso}`, m.texto)).join("")}</table>
    <div class="tit">Pontos</div>Prático ${f.pontos.pratico} · Total ${f.pontos.total} → ${f.plano}<br><span style="color:var(--suave)">Regra: Total ≥ 2; Prático ≥ 2, ou 1 + 1 de Total</span>
    <div class="tit">Se escolher menos</div>${f.por_que_nao_abaixo || "—"}<div class="tit">Por que não o de cima</div>${f.por_que_nao_acima || "—"}`;
  return `<div class="tit">Fontes</div>${f.fontes.join(" · ")}`;
}
function trocarCaso(k){
  aplicarCaso(k);
  if (st.tela === "bloqueio"){ voltarAoBloqueio(); return; }
  st.historico = []; const v = $(".vista"); if (v) v.remove(); st.tela = null; ir("casa", {sem: true});
  mostrarToast("Caso " + ROTULO_CASO[k]);
}
function pular(k){
  if (k === "bloqueio") return voltarAoBloqueio();
  if ($("#app").classList.contains("fechado")){ st.proxima = k; return abrirApp(); }
  ir(k, {sem: false});
}

/* ===== início ===== */
function iniciar(){
  if (!FD){ document.body.innerHTML = "<p style='padding:30px'>Falta prototipos/fichas_demo.js. Rode <code>python motor/gerar.py --entrega</code>.</p>"; return; }
  $("#btnVolta").innerHTML = IC.volta; $("#btnVolta").onclick = voltar;
  $("#btnOuvir").innerHTML = IC.ouvir + "Ouvir"; $("#btnOuvir").onclick = ouvir;
  $("#btnAa").onclick = toggleSimples;
  $("#veu").onclick = fecharSheet;
  aplicarCaso("perfil_A_apto_urbano");
  voltarAoBloqueio();
  addEventListener("resize", renderPainel);
  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === "x"){ st.raiox = !st.raiox; renderPainel(); }
    if (k === "r") recomecar();
    if (k === "arrowright"){ if (st.tela === "bloqueio") abrirApp(); else { const i = FLUXO.indexOf(st.tela); if (i > -1 && i < FLUXO.length - 1) ir(FLUXO[i + 1]); } }
    if (k === "arrowleft") voltar();
  });
}
iniciar();
</script>
