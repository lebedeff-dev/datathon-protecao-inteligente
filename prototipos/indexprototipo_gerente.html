<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo Seguro Residencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --amarelo:#FCFC30; --azul:#465EFF; --azul-escuro:#2D37F5; --azul-hover:#3135D9; --azul-claro:#E4ECFF;
  --texto:#111214; --suave:#6C7077; --fundo:#F4F4F6; --borda:#DBDDE1; --branco:#fff;
  --verde:#0E8A4F; --verde-claro:#E3F6EC; --vermelho:#C8312B; --vermelho-claro:#FDECEA; --coral:#FF6F68;
  --sombra:0 6px 8px rgba(24,24,27,.06),0 1px 4px rgba(24,24,27,.08),0 0 1px rgba(24,24,27,.08);
  --esc:1;
}
*{box-sizing:border-box}
body{margin:0;background:#dfe3ec;font-family:Inter,sans-serif;color:var(--texto)}
.palco{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:24px 16px;min-height:100vh}
.celular{width:390px;height:820px;background:#111;border-radius:48px;padding:12px;box-shadow:0 30px 60px rgba(20,25,60,.25);flex-shrink:0}
.tela{width:100%;height:100%;background:var(--fundo);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;background:var(--azul);color:#fff}
.topo{background:var(--azul);color:#fff;padding:8px 16px 14px}
.topo .linha{display:flex;align-items:center;gap:10px}
.topo h1{font-family:Nunito;font-size:18px;margin:0;font-weight:800;flex:1}
.topo button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px}
.progresso{display:flex;gap:4px;margin-top:10px}
.progresso span{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.progresso span.on{background:var(--amarelo)}
.passo{font-size:12px;opacity:.85;margin-top:6px}
.conteudo{flex:1;overflow-y:auto;padding:16px 16px 110px;font-size:calc(15px*var(--esc));line-height:1.5}
.folha{background:var(--branco);border-radius:16px;padding:16px;box-shadow:var(--sombra);margin-bottom:12px}
h2{font-family:Nunito;font-weight:900;font-size:calc(24px*var(--esc));line-height:1.15;margin:4px 0 8px;color:var(--texto)}
h2 em{color:var(--azul);font-style:italic}
h3{font-family:Nunito;font-weight:800;font-size:calc(17px*var(--esc));margin:0 0 6px}
p{margin:0 0 10px}
.suave{color:var(--suave);font-size:calc(13px*var(--esc))}
.btn{display:block;width:100%;border:none;border-radius:8px;min-height:calc(50px*var(--esc));font-family:Inter;font-weight:700;font-size:calc(15px*var(--esc));cursor:pointer;text-transform:uppercase;letter-spacing:.02em}
.btn-amarelo{background:var(--amarelo);color:var(--azul-escuro)}
.btn-amarelo:hover{background:#f2f21c}
.btn-azul{background:var(--azul);color:#fff}
.btn-claro{background:var(--azul-claro);color:var(--azul-escuro)}
.rodape{position:absolute;left:0;right:0;bottom:0;background:var(--branco);padding:12px 16px 18px;box-shadow:0 -4px 14px rgba(0,0,0,.06);display:flex;gap:8px;align-items:center}
.rodape .btn{flex:1}
.ajuda{width:calc(52px*var(--esc));height:calc(50px*var(--esc));border-radius:12px;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.ajuda svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.chip.obs{background:var(--verde-claro);color:var(--verde)}
.chip.est{background:#FFF6D6;color:#8A6500}
.chip.conf{background:var(--azul-claro);color:var(--azul-escuro)}
.dado{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--borda);gap:8px}
.dado:last-child{border-bottom:none}
.dado b{font-weight:600}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opcao{border:1.5px solid var(--borda);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff;font-weight:600;font-size:calc(14px*var(--esc))}
.opcao.sel{border-color:var(--azul);background:var(--azul-claro);color:var(--azul-escuro)}
.opcao svg{width:64px;height:56px;display:block;margin:0 auto 6px}
.conf-barra{height:8px;background:var(--borda);border-radius:8px;overflow:hidden;margin:6px 0 4px}
.conf-barra div{height:100%;background:var(--verde);transition:width .6s}
.cenarios{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:8px -2px}
.cenario{flex:0 0 auto;border:1.5px solid var(--borda);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;white-space:nowrap}
.cenario.sel{background:var(--azul);color:#fff;border-color:var(--azul)}
.compara{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.caixa{border-radius:14px;padding:12px}
.caixa.sem{background:var(--vermelho-claro);color:var(--vermelho)}
.caixa.com{background:var(--verde-claro);color:var(--verde)}
.caixa .valor{font-family:Nunito;font-weight:900;font-size:calc(22px*var(--esc));display:block;margin-top:2px}
.plano{border:1.5px solid var(--borda);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff;cursor:pointer;position:relative}
.plano.rec{border:2px solid var(--azul)}
.plano.sel{box-shadow:0 0 0 3px var(--azul-claro)}
.selo{position:absolute;top:-10px;left:12px;background:var(--amarelo);color:var(--azul-escuro);font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;text-transform:uppercase}
.plano .cab{display:flex;justify-content:space-between;align-items:baseline}
.plano .nome{font-family:Nunito;font-weight:900;font-size:calc(19px*var(--esc));color:var(--azul-escuro)}
.plano .preco{font-weight:700}
.lista{list-style:none;padding:0;margin:8px 0 0;font-size:calc(13px*var(--esc))}
.lista li{display:flex;gap:6px;align-items:flex-start;margin-bottom:3px}
.ok{color:var(--verde);font-weight:800}.nao{color:#B0B3BA;font-weight:800}
.comodos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.comodo{border:1.5px solid var(--borda);border-radius:12px;padding:10px;cursor:pointer;background:#fff;font-weight:600;font-size:calc(14px*var(--esc));display:flex;align-items:center;gap:8px}
.comodo.sel{border-color:var(--azul);background:var(--azul-claro)}
.comodo svg{width:30px;height:30px;flex-shrink:0}
.situacao{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--borda);align-items:flex-start}
.situacao:last-child{border:none}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.s{background:var(--verde-claro);color:var(--verde)}.tag.n{background:#EEE;color:#666}
.assist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.assist div{background:var(--azul-claro);border-radius:12px;padding:8px 6px;text-align:center;font-size:calc(11.5px*var(--esc));font-weight:600;color:var(--azul-escuro)}
.assist div.off{background:#F0F0F2;color:#A3A6AD}
.assist svg{width:26px;height:26px;display:block;margin:0 auto 4px}
.cob{padding:10px 0;border-bottom:1px solid var(--borda)}
.cob:last-child{border:none}
.cob .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--azul)}
.sw{position:relative;width:46px;height:26px;flex-shrink:0}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#C9CCD3;border-radius:999px;cursor:pointer;transition:.2s}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--azul)}
.sw input:checked+span:before{transform:translateX(20px)}
.aviso{background:#FFF6D6;border-radius:12px;padding:10px 12px;font-size:calc(13px*var(--esc));color:#6B4F00;margin:8px 0}
.aviso.azul{background:var(--azul-claro);color:var(--azul-escuro)}
.precobar{display:flex;justify-content:space-between;align-items:baseline;background:var(--azul-claro);border-radius:12px;padding:10px 12px;margin:8px 0}
.precobar b{font-family:Nunito;font-size:calc(22px*var(--esc));color:var(--azul-escuro)}
.vig{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.vig div{border:1.5px solid var(--borda);border-radius:10px;padding:8px 2px;text-align:center;cursor:pointer;font-weight:700;font-size:calc(13px*var(--esc));background:#fff}
.vig div small{display:block;font-weight:600;font-size:10px;color:var(--verde)}
.vig div.sel{border-color:var(--azul);background:var(--azul-claro)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--borda);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:calc(14px*var(--esc))}
.check.sel{border-color:var(--verde);background:var(--verde-claro)}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--borda);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.check.sel .box{background:var(--verde);border-color:var(--verde)}
.ferramentas{position:absolute;top:44px;right:14px;display:flex;gap:6px;z-index:3}
.ferramentas button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:4px 10px;cursor:pointer}
.ferramentas button.on{background:var(--amarelo);color:var(--azul-escuro);border-color:var(--amarelo)}
.sheet-fundo{position:absolute;inset:0;background:rgba(17,18,20,.45);display:none;align-items:flex-end;z-index:10}
.sheet-fundo.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:85%;overflow-y:auto}
.sheet .item{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--borda);border-radius:14px;margin-bottom:8px;cursor:pointer}
.sheet .item:hover{border-color:var(--azul)}
.sheet .item svg{width:28px;height:28px;color:var(--azul);flex-shrink:0}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px}
.msg.ela{background:var(--azul-claro);align-self:flex-start;border-bottom-left-radius:4px}
.msg.eu{background:var(--azul);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bloqueio{background:linear-gradient(160deg,#2a3a8f,#465EFF 55%,#7b8cff);color:#fff;height:100%;padding:56px 14px 14px;display:flex;flex-direction:column}
.hora{font-family:Nunito;font-weight:800;font-size:64px;text-align:center;line-height:1}
.data{text-align:center;opacity:.85;margin-bottom:26px}
.notif{background:rgba(255,255,255,.92);color:var(--texto);border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer;font-size:13.5px}
.notif .app{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--suave);margin-bottom:4px}
.notif .ic{width:22px;height:22px;border-radius:6px;background:var(--amarelo);display:flex;align-items:center;justify-content:center;color:var(--azul-escuro);font-weight:900;font-size:10px}
.notif .ic.wa{background:#25D366;color:#fff}
.notas{width:380px;max-width:100%;background:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--sombra);font-size:14px;line-height:1.55;position:sticky;top:24px}
.notas h4{font-family:Nunito;font-size:18px;margin:0 0 4px;color:var(--azul-escuro)}
.notas .prob{background:var(--vermelho-claro);color:#7a1f1b;border-radius:10px;padding:8px 10px;margin:8px 0}
.notas .sol{background:var(--verde-claro);color:#0b5a35;border-radius:10px;padding:8px 10px;margin:8px 0}
.notas nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.notas nav button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.notas nav button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.simples{--esc:1.25}
body.simples .so-normal{display:none}
.track{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.track .bola{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.track .bola.ag{background:var(--azul)}
@media (max-width:820px){.notas{position:static}}
/* ---------- jornada do gerente ---------- */
.palco{flex-wrap:wrap}
.canal{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--borda);border-radius:14px;margin-bottom:8px;cursor:pointer;background:#fff}
.canal.sel{border-color:var(--azul);background:var(--azul-claro)}
.canal svg{width:26px;height:26px;color:var(--azul);flex-shrink:0}
.wpp{background:#E7F8EE;border-radius:14px;padding:10px 12px;font-size:13.5px}
.wpp .de{font-size:12px;color:#1d7a46;font-weight:700;margin-bottom:2px}
.mudou{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--borda);font-size:calc(14px*var(--esc))}
.mudou:last-child{border:none}
.mudou s{color:var(--suave)}
.mudou b{color:var(--verde)}
.painel{display:none;width:940px;max-width:100%;background:#fff;border-radius:18px;box-shadow:0 30px 60px rgba(20,25,60,.18);overflow:hidden;font-size:14px;line-height:1.5}
.painel.on{display:block}
.ptopo{background:var(--azul-escuro);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptopo b{font-family:Nunito;font-size:16px}
.pcab{padding:16px 18px 0}
.palerta{display:inline-flex;gap:8px;align-items:center;background:var(--amarelo);color:var(--azul-escuro);font-weight:700;font-size:12.5px;border-radius:999px;padding:4px 12px}
.pgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;padding:14px 18px 18px}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
.pcard{border:1px solid var(--borda);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.pcard h5{font-family:Nunito;font-size:15px;font-weight:900;margin:0 0 8px;color:var(--azul-escuro)}
.pt{width:100%;border-collapse:collapse;font-size:13px}
.pt td{padding:6px 4px;border-bottom:1px solid var(--borda);vertical-align:top}
.pt tr:last-child td{border:none}
.pcard.sug{background:#FFFBEA;border-color:#F1DF9A}
.pcard.sug li{margin-bottom:6px}
.pplanos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pplanos div{border:1.5px solid var(--borda);border-radius:10px;padding:8px;text-align:center;cursor:pointer;font-weight:700}
.pplanos div small{display:block;font-weight:500;color:var(--suave)}
.pplanos div.sel{border-color:var(--azul);background:var(--azul-claro);color:var(--azul-escuro)}
.pacoes{display:flex;gap:8px;flex-wrap:wrap}
.pacoes .btn{width:auto;flex:1;min-width:200px}
textarea{width:100%;font-family:Inter;font-size:13px;border:1.5px solid var(--borda);border-radius:10px;padding:8px;resize:vertical;min-height:64px}
.objecao{margin-bottom:8px}.objecao b{display:block}
</style>
</head>
<body>
<div class="palco">
  <div class="celular"><div class="tela" id="tela"></div></div>
  <section class="painel" id="painel"></section>
  <aside class="notas" id="notas"></aside>
</div>

<script src="fichas_demo.js"></script>
<script>
// ---------- dados do caso (CASO_00005 / IMO_CASO_00005_01 da base de teste) ----------
const CLIENTE = {
  cidade: "Curitiba", complemento: "Bloco B, apto 305", tipo: "Apartamento", area: 110, origemArea: "cadastro do IPTU",
  financiado: true, parcela: 950, condominio: 650, dependentes: 1, eletronicos36m: 8800, mora: true,
  // sinais usados na jornada do gerente (mesmo caso da base de teste)
  vidracaria24m: 11000, compras36m: 20750, outroImovel: true
};
const GERENTE = {nome:"Ricardo", inicial:"RG", especialista:"Juliana", protocolo:"BB-8K2"};
const DUVIDAS = ["O valor do plano","O que está coberto","Se meu imóvel pode ter seguro","Outra dúvida"];
const SUGESTAO = {roubo:13000, vidros:11000};
// ---------- produto (nomes e limites tirados do app atual; preços ilustrativos calibrados nos valores vistos no app) ----------
const COB = {
  incendio:{nome:"Incêndio, raio, explosão e fumaça", padrao:300000, min:100000, max:600000, passo:10000, taxa:0.03, franquia:"sem franquia"},
  eletricos:{nome:"Danos elétricos", padrao:10000, min:5000, max:30000, passo:1000, taxa:0.4, franquia:"10% do prejuízo, mínimo R$ 450"},
  agua:{nome:"Danos por água (alagamento, chuva, cano)", padrao:5000, min:3000, max:50000, passo:1000, taxa:0.5, franquia:"10% do prejuízo, mínimo R$ 1.000"},
  vendaval:{nome:"Vendaval e granizo", padrao:20000, min:1000, max:60000, passo:1000, taxa:0.05, franquia:"10% do prejuízo, mínimo R$ 500"},
  impacto:{nome:"Impacto de veículos e queda de aeronave", padrao:10000, min:10000, max:10000, passo:1000, taxa:0.04, franquia:"10% do prejuízo, mínimo R$ 400"},
  roubo:{nome:"Roubo ou furto com arrombamento", padrao:3000, min:1000, max:45000, passo:1000, taxa:3.5, franquia:"10% do prejuízo, mínimo R$ 400", extra:true},
  vidros:{nome:"Quebra de vidros", padrao:1500, min:1000, max:25000, passo:500, taxa:3.58, franquia:"R$ 150", extra:true},
  rc:{nome:"Responsabilidade civil familiar", padrao:40000, min:10000, max:200000, passo:5000, taxa:0.35, franquia:"sem franquia", extra:true},
  aluguel:{nome:"Perda ou pagamento de aluguel", padrao:10000, min:5000, max:30000, passo:1000, taxa:1.0, franquia:"sem franquia", extra:true},
  despesas:{nome:"Despesas emergenciais", padrao:5000, min:2000, max:15000, passo:1000, taxa:2.004, franquia:"sem franquia", extra:true}
};
const FIXAS = ["incendio","eletricos","agua","vendaval","impacto"];
const PLANOS = {
  ESSENCIAL:{nome:"Essencial", extras:[], pacotes:1},
  PRATICO:{nome:"Prático", extras:["roubo","vidros"], pacotes:3},
  TOTAL:{nome:"Total", extras:["roubo","vidros","rc","aluguel","despesas"], pacotes:6}
};
const PACOTES = ["Casa em apuros","Casa funcionando","Casa limpa","Casa arrumada","Casa sem pragas","Casa segura"];
const BASE = 18.34, PACOTE = 6;
const DESCONTO = {1:0,2:.05,3:.096,4:.14,5:.18};

const st = {
  tela:0, plano:"TOTAL", recomendado:"TOTAL", cenario:"agua", vig:1, pagamento:"debito",
  resp:{mora:null, tipo:"apto"}, valores:{}, ligadas:{}, entend:[false,false], comodo:"banheiro",
  origem:3, duvida:null, canal:null, consent:false, ger:null, antes:null, motivo:""
};
Object.keys(COB).forEach(k=>{st.valores[k]=COB[k].padrao; st.ligadas[k]=true});
st.valores.incendio = 260000; // ajuste pela calculadora de reconstrução (110 m² x custo de obra no PR)
st.valores.agua = 18000;      // ajuste pelo prejuízo típico de alagamento num apto de 110 m²

// ---------- dados do motor (prototipos/fichas_demo.js, gerado por motor/gerar.py) ----------
// Se o arquivo existir, a demo usa a ficha real do motor; senão, fica o caso escrito acima.
let FICHA = null;
const MAPA_COB = {INCENDIO_RAIO_EXPLOSAO_FUMACA:"incendio", DANOS_ELETRICOS:"eletricos", DANOS_POR_AGUA:"agua",
  VENDAVAL_GRANIZO:"vendaval", IMPACTO_VEICULOS_TERRESTRES:"impacto", ROUBO_FURTO_ARROMBAMENTO:"roubo",

function aplicarFicha(id){
  const f = window.FICHAS_DEMO && window.FICHAS_DEMO.fichas[id];
  if(!f) return;
  FICHA = f;
  CLIENTE.cidade = f.local.split("/")[0].replace("Sao Paulo","São Paulo").replace("Brasilia","Brasília").replace("Goiania","Goiânia");
  CLIENTE.complemento = titulo(f.complemento);
  CLIENTE.area = f.campos.area.valor;
  CLIENTE.origemArea = f.campos.area.natureza === "OBSERVADO" ? "cadastro" : "estimada";
  CLIENTE.parcela = f.sinais.parcela; CLIENTE.vidracaria24m = f.sinais.vidracaria;
  st.plano = st.recomendado = f.plano;
  Object.keys(COB).forEach(k=>{ st.valores[k] = COB[k].padrao; st.ligadas[k] = true; });
  f.coberturas.forEach(c=>{
    const k = MAPA_COB[c.cobertura]; if(!k) return;
    const meio = Math.round((c.min + c.max) / 2 / COB[k].passo) * COB[k].passo;
    st.valores[k] = Math.min(COB[k].max, Math.max(COB[k].min, meio));
  });
  const vid = f.coberturas.find(c=>c.cobertura==="QUEBRA_DE_VIDROS"), rob = f.coberturas.find(c=>c.cobertura==="ROUBO_FURTO_ARROMBAMENTO");
  if(vid) SUGESTAO.vidros = Math.min(COB.vidros.max, Math.round(vid.max / COB.vidros.passo) * COB.vidros.passo);
  if(rob) SUGESTAO.roubo = Math.min(COB.roubo.max, Math.round(rob.max / COB.roubo.passo) * COB.roubo.passo);
  st.resp.mora = null; st.ger = null; st.motivo = ""; st.antes = null;
}

  p.extras.forEach(k=>{ if(ligadas[k]) v += COB[k].taxa*valores[k]/1000 });
  return v;
}

}

function telaAjuste(){
  const p = PLANOS[st.plano];
  const v = preco(st.plano);
  let dica = "";
  if(st.plano==="PRATICO" && !st.ligadas.roubo && !st.ligadas.vidros){
    const e = preco("ESSENCIAL");
    dica = `<div class="aviso">Sem roubo e sem vidros, as coberturas ficaram iguais às do <b>Essencial</b>. A diferença agora são só 2 pacotes de assistência. <a href="#" onclick="st.plano='ESSENCIAL';render();return false">Trocar para o Essencial e pagar ${brl2(e)}/mês</a></div>`;
  }
  if(st.plano==="TOTAL" && !st.ligadas.rc && !st.ligadas.aluguel && !st.ligadas.despesas){
    dica = `<div class="aviso">Sem as 3 coberturas do Total, ele ficou igual ao <b>Prático</b> mais 3 pacotes de assistência. <a href="#" onclick="st.plano='PRATICO';render();return false">Ver o Prático por ${brl2(preco('PRATICO'))}/mês</a></div>`;
  }
  const linha = k => {const c=COB[k], fixa=FIXAS.includes(k), lig=fixa||st.ligadas[k];
    return `<div class="cob"><div class="l1"><span>${c.nome}</span>${fixa?'<span class="chip conf">fixa</span>':`<label class="sw"><input type="checkbox" ${lig?'checked':''} onchange="st.ligadas['${k}']=this.checked;render()"><span></span></label>`}</div>
      ${lig && c.min!==c.max?`<div class="suave" style="display:flex;justify-content:space-between"><span>${brl(c.min)}</span><b style="color:var(--texto)">${brl(st.valores[k])}</b><span>${brl(c.max)}</span></div>
      <input type="range" min="${c.min}" max="${c.max}" step="${c.passo}" value="${st.valores[k]}" oninput="st.valores['${k}']=+this.value;atualizaPreco()" onchange="render()">`:''}
      ${k==='incendio' && FICHA ? `<p class="suave" style="margin:2px 0 0">Faixa do motor: ${brl(FICHA.coberturas[0].min)} a ${brl(FICHA.coberturas[0].max)}. ${FICHA.valor_imovel.segundo_risco ? "A estrutura tem seguro do condomínio ou do financiamento; aqui entram acabamentos e bens." : "Reconstrução + bens, pelo custo de obra do IBGE e do Sinduscon."}</p>`
        : k==='incendio' ? `<p class="suave" style="margin:2px 0 0">Reconstruir ${CLIENTE.area} m² no PR custa entre ${brl(231000)} e ${brl(290000)}. Mais que isso você paga sem precisar.</p>`:''}
      ${k==='agua'?`<p class="suave" style="margin:2px 0 0">Um alagamento como o da primeira tela custa cerca de ${brl(17800)}.</p>`:''}
    </div>`};
  return {html:`
    <h2>Ajuste do <em>seu jeito</em></h2>
    <p class="suave">O preço muda na hora. Coberturas fixas não saem; só o valor muda.</p>
    <div class="precobar"><span>Plano ${p.nome}</span><b id="pv">${brl2(v)}/mês</b></div>
    ${dica}
    <div class="folha">${FIXAS.map(linha).join("")}</div>
    ${p.extras.length?`<div class="folha"><h3>Adicionais do ${p.nome}</h3>${p.extras.map(linha).join("")}</div>`:`<div class="aviso azul">O Essencial não tem adicionais. Quer roubo ou vidros? <a href="#" onclick="st.plano='PRATICO';render();return false">Ver o Prático</a></div>`}
    <p class="suave">Preços ilustrativos, calibrados nos valores vistos no app atual.</p>`,
   rodape:`<button class="btn btn-amarelo" onclick="ir(6)">Continuar</button>`};
}

    <div class="folha"><h3>Como prefere falar?</h3>
      ${canais.map(([k,ic,t,s])=>`<div class="canal ${st.canal===k?'sel':''}" onclick="st.canal='${k}';render()">${ic}<div><b>${t}</b><br><span class="suave">${s}</span></div></div>`).join("")}</div>`,
   rodape:`<button class="btn btn-amarelo" onclick="${pronto?`ir(I('enviado'))`:`alert('Escolha a dúvida, autorize o compartilhamento e escolha como prefere falar')`}">Enviar para meu gerente</button>`};
}

function telaEnviado(){
  const comoFala = {app:"responde aqui no app", ligar:"liga para você", wpp:"fala com você"}[st.canal || "app"];
  return {html:`
    <h2>Pronto, o ${GERENTE.nome} <em>já recebeu</em></h2>
    <div class="folha">
      <div class="track"><span class="bola">✓</span><div><b style="font-weight:600">Proposta enviada</b><br><span class="suave">Agora · protocolo ${GERENTE.protocolo}</span></div></div>
      <div class="track"><span class="bola">✓</span><div><b style="font-weight:600">${GERENTE.nome} foi avisado no sistema dele</b><br><span class="suave">Dúvida: ${DUVIDAS[st.duvida ?? 0].toLowerCase()}</span></div></div>
      <div class="track"><span class="bola ag">⏱</span><div><b style="font-weight:600">Ele ${comoFala} em até 15 min</b><br><span class="suave">Se ele estiver ocupado, a especialista ${GERENTE.especialista} assume com a mesma proposta.</span></div></div>
    </div>
    ${st.canal==="wpp"?`<div class="folha"><h3>A mensagem que chega no WhatsApp</h3>
      <div class="wpp"><div class="de">BB (conta oficial)</div>Recebemos seu pedido sobre o Seguro Residencial. Protocolo ${GERENTE.protocolo}. Seu gerente ${GERENTE.nome} vai falar com você. Para ver a proposta, abra o app do BB. <i>O BB nunca pede senha por aqui.</i></div>
      <p class="suave" style="margin:8px 0 0">Sem link e sem dados da proposta: ela só abre dentro do app.</p></div>`:""}
    <div class="aviso azul">Sua proposta fica guardada. Pode fechar o app; avisamos quando o ${GERENTE.nome} responder.</div>`,
   rodape:`<button class="btn btn-claro" onclick="ir(st.origem)">Voltar</button><button class="btn btn-amarelo" onclick="ir(I('gerente'))">Ver o lado do gerente</button>`};
}

const impacto = k => Math.max(0, SUGESTAO[k]-st.valores[k]) * COB[k].taxa / 1000;
function precoAjustado(planoKey){
  return preco(planoKey, {...st.ligadas, roubo:true, vidros:true}, {...st.valores, ...SUGESTAO});
}
function gerPreco(){
  const vals = {...st.valores, roubo:st.ger.roubo, vidros:st.ger.vidros};
  const lig = {...st.ligadas, roubo:true, vidros:true};
  return preco(st.ger.plano, lig, vals);
}

function painelGerente(){
  if(!st.ger) st.ger = {plano:st.plano, roubo:st.valores.roubo, vidros:st.valores.vidros};
  if(!st.motivo) st.motivo = (!FICHA || CLIENTE.vidracaria24m > 0)
    ? `Vi que você trocou vidros recentemente e comprou móveis e eletrônicos nos últimos anos. Ajustei quebra de vidros e roubo para cobrir o que você tem hoje.`
    : `Conferimos juntos os seus bens. Ajustei roubo e quebra de vidros para cobrir o que você tem hoje.`;
  const g = st.ger, temExtras = g.plano!=="ESSENCIAL";
  const duvida = st.duvida!==null ? DUVIDAS[st.duvida].toLowerCase() : "o valor do plano";
  const canal = {app:"conversa no app", ligar:"pediu ligação", wpp:"aviso no WhatsApp"}[st.canal] || "conversa no app";
  const dado = (n,v,cls,orig) => `<tr><td>${n}</td><td><b>${v}</b></td><td><span class="chip ${cls}">${orig}</span></td></tr>`;
  const barra = (k,label) => `<div class="cob" style="padding:6px 0"><div class="l1"><span>${label}</span><span class="chip ${g[k]===SUGESTAO[k]?'obs':'est'}">${g[k]===SUGESTAO[k]?'sugestão aplicada':'sugestão: '+brl(SUGESTAO[k])}</span></div>
      <div class="suave" style="display:flex;justify-content:space-between"><span>${brl(COB[k].min)}</span><b style="color:var(--texto)" id="gv_${k}">${brl(g[k])}</b><span>${brl(COB[k].max)}</span></div>
      <input type="range" min="${COB[k].min}" max="${COB[k].max}" step="${COB[k].passo}" value="${g[k]}" oninput="st.ger['${k}']=+this.value;document.getElementById('gv_${k}').textContent=brl(this.value);document.getElementById('gpv').textContent=brl2(gerPreco())+'/mês'" onchange="render()"></div>`;
  return `
  <div class="ptopo"><b>Plataforma de Atendimento · Seguros</b><span>${GERENTE.nome} G. · gerente de relacionamento</span></div>
  <div class="pcab">
    <span class="palerta">🔔 Pedido de ajuda · há 2 min · ${GERENTE.protocolo} · ${canal}</span>
    <h2 style="margin-top:10px">Cliente com dúvida sobre <em>${duvida}</em></h2>
    <p>${FICHA ? `${NOME_TIPO[FICHA.campos.tipo.valor]} (${NOME_VINCULO[FICHA.campos.vinculo.valor].toLowerCase()}) em ${CLIENTE.cidade}, ${CLIENTE.area} m². Motor: plano <b>${PLANOS[FICHA.plano].nome}</b>, confiança ${FICHA.confianca.toLowerCase()} (${FICHA.confianca_score}), canal sugerido ${FICHA.canal==="ONE_CLICK"?"1 toque":"gerente"}.`
      : `Apartamento financiado em ${CLIENTE.cidade} (${CLIENTE.area} m²), mora com ${CLIENTE.dependentes} dependente.`} Viu o plano <b>${PLANOS[st.plano].nome}</b> (recomendado: ${PLANOS[st.recomendado].nome}) e parou na tela <b>${TELAS[st.origem].titulo}</b>. Compartilhamento autorizado pelo cliente por 48 h.</p>
  </div>
  <div class="pgrid">
    <div>
      ${FICHA ? `<div class="pcard"><h5>O que o motor sabe e de onde veio</h5><table class="pt">
        ${[["Tipo","tipo",NOME_TIPO[FICHA.campos.tipo.valor]],["Relação","vinculo",NOME_VINCULO[FICHA.campos.vinculo.valor]],["Uso","uso",NOME_USO[FICHA.campos.uso.valor]],
           ["Área","area",FICHA.campos.area.valor+" m²"],["Bens","bens",brl(FICHA.campos.bens.min)+" a "+brl(FICHA.campos.bens.max)]].map(([n,k,v])=>{
            const d = FICHA.campos[k], [cls,txt] = SELO[d.natureza] || SELO.ESTIMADO;
            return `<tr><td>${n}</td><td><b>${v}</b><br><span class="suave" style="font-size:12px">${frase(d.fonte)}</span></td><td><span class="chip ${cls}">${txt} · peso ${d.peso}</span></td></tr>`}).join("")}
        </table>
        ${FICHA.pendencias.length?`<p style="margin:10px 0 4px"><b>A confirmar antes de contratar</b></p><ul style="margin:0;padding-left:18px">${FICHA.pendencias.map(p=>`<li>${frase(p.texto)}</li>`).join("")}</ul>`:""}
        <p style="margin:10px 0 4px"><b>Perguntas do motor</b> (${FICHA.perguntas.length} de ${FICHA.perguntas_candidatas})</p><ol style="margin:0;padding-left:18px">${FICHA.perguntas.map(p=>`<li>${p.texto}</li>`).join("")}</ol>
        <p class="suave" style="margin:10px 0 0">Fontes: ${FICHA.fontes.join(" · ")}</p>
      </div>` : ""}
      <div class="pcard" style="${FICHA?'display:none':''}"><h5>O que sabemos e de onde veio</h5><table class="pt">
        ${dado("Tipo","Apartamento","obs","observado · endereço")}
        ${dado("Área",CLIENTE.area+" m²","obs","observado · IPTU")}
        ${dado("Relação","Seu, financiado","obs","observado · parcela "+brl(CLIENTE.parcela))}
        ${dado("Mora no imóvel",st.resp.mora===false?"Não":"Sim","conf","confirmado pelo cliente")}
        ${dado("Dependentes",String(CLIENTE.dependentes),"obs","observado · cadastro")}
        ${dado("Bens em casa","≈ "+brl(SUGESTAO.roubo),"est","estimado · compras 36 meses")}
        ${dado("Vidraçaria",brl(CLIENTE.vidracaria24m)+" em 24 meses","obs","observado · transações")}
        ${dado("Outro imóvel","Sim, 1 cadastrado","obs","observado · cadastro")}
      </table></div>
      <div class="pcard"><h5>Proposta (você ajusta, o cliente decide)</h5>
        <div class="pplanos">${["ESSENCIAL","PRATICO","TOTAL"].map(k=>`<div class="${g.plano===k?'sel':''}" onclick="st.ger.plano='${k}';render()">${PLANOS[k].nome}${k===st.recomendado?' ★':''}<small>${k===g.plano?'':'mudar'}</small></div>`).join("")}</div>
        ${temExtras?barra("vidros","Quebra de vidros")+barra("roubo","Roubo ou furto com arrombamento"):`<div class="aviso">O Essencial não tem roubo nem vidros. As sugestões do motor só valem no Prático e no Total.</div>`}
        <div class="precobar"><span>Novo preço</span><b id="gpv">${brl2(gerPreco())}/mês</b></div>
        <p class="suave" style="margin:0 0 4px">Motivo que o cliente vai ler no app:</p>
        <textarea oninput="st.motivo=this.value">${st.motivo}</textarea>
      </div>
      <div class="pacoes">
        <button class="btn btn-claro" onclick="alert('Ligando para o número cadastrado do cliente (ilustrativo).')">Ligar para o cliente</button>
        <button class="btn btn-amarelo" onclick="enviarAjuste()">Enviar proposta ajustada</button>
      </div>
    </div>
    <div>
      <div class="pcard sug"><h5>O motor sugere revisar</h5><ol style="margin:0;padding-left:18px">
        ${FICHA ? [
          CLIENTE.vidracaria24m > 0 ? `<li><b>Quebra de vidros</b> está em ${brl(st.valores.vidros)}; houve ${brl(CLIENTE.vidracaria24m)} em vidraçaria nos últimos 24 meses. Teto do motor: ${brl(SUGESTAO.vidros)} <span class="suave">(+${brl2(impacto("vidros"))}/mês)</span>.</li>` : "",
          st.ger.plano !== "ESSENCIAL" ? `<li><b>Roubo</b> está em ${brl(st.valores.roubo)} (meio da faixa do motor). Se o cliente confirmar mais eletrônicos, suba até ${brl(SUGESTAO.roubo)} <span class="suave">(+${brl2(impacto("roubo"))}/mês)</span>.</li>` : "",
          FICHA.pendencias.length ? `<li><b>Elegibilidade:</b> confirme ${FICHA.pendencias.map(p=>p.codigo==="POSSIVEL_REFORMA"?"se há obra ou reforma":p.codigo==="SEGURO_EXISTENTE"?"se já há seguro BB no endereço":p.texto).join(" e ")} antes de enviar a proposta.</li>` : "",
          FICHA.avisos.length ? `<li>${frase(FICHA.avisos[0])}.</li>` : ""
        ].join("") : `
        <li><b>Quebra de vidros</b> está em ${brl(st.valores.vidros)}, mas houve ${brl(CLIENTE.vidracaria24m)} em vidraçaria nos últimos 24 meses. Sugestão: ${brl(SUGESTAO.vidros)} <span class="suave">(+${brl2(impacto("vidros"))}/mês)</span>.</li>
        <li><b>Roubo</b> está em ${brl(st.valores.roubo)} (padrão do app), e os bens são estimados em ≈ ${brl(SUGESTAO.roubo)}. Sugestão: ${brl(SUGESTAO.roubo)} <span class="suave">(+${brl2(impacto("roubo"))}/mês)</span>.</li>
        <li>O cliente tem <b>outro imóvel</b> cadastrado. Pergunte se quer proteger também.</li>`}</ol>
        <button class="btn btn-claro" style="margin-top:10px;min-height:40px" onclick="st.ger.roubo=SUGESTAO.roubo;st.ger.vidros=SUGESTAO.vidros;if(st.ger.plano==='ESSENCIAL')st.ger.plano='PRATICO';render()">Aplicar sugestões</button></div>
      <div class="pcard"><h5>Roteiro da conversa</h5><ol style="margin:0;padding-left:18px">
        <li>Confirme a dúvida: <i>${duvida}</i>.</li>
        ${FICHA ? FICHA.perguntas.map(p=>`<li>"${p.texto}"</li>`).join("") : `
        <li>"Os vidros que você trocou (box, janelas, sacada) ficam neste apartamento?"</li>
        <li>"Seus móveis e eletrônicos somam por volta de ${brl(SUGESTAO.roubo)}?"</li>`}
        <li>Se o preço pesar, mostre a alternativa: ${FICHA ? FICHA.alternativa.texto : "o Prático"}.</li></ol></div>
      <div class="pcard"><h5>Objeções prováveis</h5>
        <div class="objecao"><b>"Está caro."</b>O Prático com roubo e vidros ajustados sai por ${brl2(precoAjustado("PRATICO"))}/mês, sem responsabilidade civil nem aluguel. Proteger os bens de verdade custa mais que o padrão do app: mostre o porquê, não esconda.</div>
        <div class="objecao"><b>"O condomínio já tem seguro."</b>Cobre o prédio, não os bens de dentro nem o dano ao vizinho.</div>
        <div class="objecao"><b>"Já pago seguro no financiamento."</b>Ele protege o imóvel e a dívida, não os seus bens.</div></div>
      <p class="suave">Você vê um resumo, não o extrato. A renda não aparece e só ajuda a estimar os bens de quem não tem compras; a idade não decide nada. Acesso registrado: ${GERENTE.nome} G., protocolo ${GERENTE.protocolo}.</p>
    </div>
  </div>`;
}

function enviarAjuste(){
  st.antes = {plano:st.plano, roubo:st.valores.roubo, vidros:st.valores.vidros, preco:preco(st.plano)};
  st.plano = st.ger.plano;
  st.valores.roubo = st.ger.roubo; st.valores.vidros = st.ger.vidros;
  st.ligadas.roubo = true; st.ligadas.vidros = true;
  st.entend = [false,false];
  ir(I("retorno"));
}

function telaRetorno(){
  return `<div class="bloqueio fade">
    <div class="hora">9:58</div><div class="data">terça-feira, 28 de outubro</div>
    <div class="notif" onclick="ir(I('ajustada'))"><div class="app"><span class="ic">BB</span>App BB · agora</div>
      <b>${GERENTE.nome} atualizou sua proposta</b><br>Toque para conferir o que mudou. Nada foi contratado ainda.</div>
    <p style="text-align:center;opacity:.8;font-size:12px;margin-top:auto">Toque no aviso para abrir o app</p></div>`;
}

function telaAjustada(){
  const a = st.antes || {plano:st.plano, roubo:COB.roubo.padrao, vidros:COB.vidros.padrao, preco:preco(st.plano)};
  const novo = preco(st.plano), dif = novo - a.preco;
  const linha = (n,de,para) => de===para ? "" : `<div class="mudou"><span>${n}</span><span><s>${de}</s> → <b>${para}</b></span></div>`;
  const temExtras = st.plano!=="ESSENCIAL";
  return {html:`
    <h2>${GERENTE.nome} ajustou sua <em>proposta</em></h2>
    <div class="aviso azul" data-say><b>Por quê?</b> ${st.motivo}</div>
    <div class="folha"><h3>O que mudou</h3>
      ${linha("Plano",PLANOS[a.plano].nome,PLANOS[st.plano].nome)}
      ${temExtras?linha("Quebra de vidros",brl(a.vidros),brl(st.valores.vidros)):""}
      ${temExtras?linha("Roubo ou furto",brl(a.roubo),brl(st.valores.roubo)):""}
      <div class="mudou"><span>Preço</span><span><s>${brl2(a.preco)}</s> → <b>${brl2(novo)}/mês</b></span></div>
      <p class="suave" style="margin:6px 0 0">${dif>=0?`Mais ${brl2(dif)} por mês`:`Menos ${brl2(-dif)} por mês`}. As outras coberturas continuam iguais.</p></div>
    <div class="aviso">Nada foi contratado. Só você decide.</div>`,
   rodape:`<button class="btn btn-claro" onclick="abrirAjuda()">Tenho dúvida</button><button class="btn btn-amarelo" onclick="ir(I('fechar'))">Conferir e contratar</button>`};
}

// ---------- modo simples e voz ----------
function toggleSimples(){ document.body.classList.toggle("simples"); render(); }
function ouvir(){
  const c = document.getElementById("conteudo"); if(!c || !window.speechSynthesis) return;
  const partes = [...c.querySelectorAll("h2,[data-say],.aviso,h3")].map(e=>e.innerText).join(". ");
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(partes); u.lang="pt-BR"; u.rate=.95; speechSynthesis.speak(u);
}

// ---------- navegação ----------
function ir(i){ if(window.speechSynthesis) speechSynthesis.cancel(); st.tela=i; render(); const c=document.getElementById("conteudo"); if(c) c.scrollTop=0; }
function voltar(){
  const id = TELAS[st.tela].id;
  if(id==="pedir") return ir(st.origem);
  if(id==="ajustada") return ir(I("retorno"));
  ir(Math.max(0, st.tela-1));
}
function renderNotas(){
  const t = TELAS[st.tela];
  document.getElementById("notas").innerHTML = `
    <h4>${st.tela+1}. ${t.titulo}</h4>
    <div class="prob"><b>App atual:</b> ${t.prob}</div>
    <div class="sol"><b>Nossa proposta:</b> ${t.sol}</div>
    ${window.FICHAS_DEMO ? `<div style="background:var(--azul-claro);border-radius:10px;padding:8px 10px;margin:8px 0">
      <b style="font-size:13px">Caso real do motor:</b>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${Object.entries(window.FICHAS_DEMO.casos).filter(([k,id])=>id).map(([k,id])=>
        `<button onclick="trocarCaso('${id}')" style="border:1px solid var(--azul);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;background:${FICHA&&FICHA.imovel_id===id?'var(--azul)':'#fff'};color:${FICHA&&FICHA.imovel_id===id?'#fff':'var(--azul-escuro)'}">${ROTULO_CASO[k]||k}</button>`).join("")}</div>
      ${FICHA?`<p style="font-size:12px;margin:6px 0 0">${FICHA.imovel_id} · ${FICHA.local} · plano ${PLANOS[FICHA.plano].nome} · ${FICHA.canal==="ONE_CLICK"?"1 toque":"gerente"}</p>`:""}</div>` : ""}
    <p style="font-size:12px;color:var(--suave);margin:8px 0 0">${FICHA ? "Dados, plano, faixas e motivo vêm do motor (motor/gerar.py → prototipos/fichas_demo.js)." : "Caso real da base de teste: CASO_00005 (apartamento financiado em Curitiba)."} Preços e prejuízos são ilustrativos. Use <b>Aa</b> para o modo simples e <b>Ouvir</b> para a leitura em voz alta. O botão <b>Ajuda</b> está em todas as telas.</p>
    <nav>${TELAS.map((x,i)=>`<button class="${i===st.tela?'on':''}" onclick="ir(${i})">${i+1}. ${x.titulo}</button>`).join("")}</nav>`;
}
if(window.FICHAS_DEMO) aplicarFicha(window.FICHAS_DEMO.casos.perfil_A_apto_urbano || window.FICHAS_DEMO.casos.one_click_limpo);
render();
</script>
</body>
</html>
